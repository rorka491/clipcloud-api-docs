info:
  name: createMessage
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/messages"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Session-id
      value: "{{session_id}}"
  body:
    type: json
    data: |-
      {
        "text": "test",
        "file_key": "{{file_key}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();

        bru.setEnvVar("load_file_key", body.file_key);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
