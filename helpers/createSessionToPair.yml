info:
  name: createSessionToPair
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE_URL}}/sessions/init"

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        bru.setEnvVar("to_pair_session_id", body.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
