info:
  name: setSessionUsername
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE_URL}}/sessions/set?username=rodion"
  headers:
    - name: X-Session-id
      value: "{{session_id}}"
  params:
    - name: username
      value: rodion
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
